name: Build

on:
  push:
    branches: ["**"]
    paths-ignore:
      - "dist/**"
  pull_request:
  workflow_dispatch:

# Wird gebraucht, damit die fertige JAR zurueck ins Repository geschrieben
# werden kann.
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    # Der eigene Commit mit der JAR soll keinen weiteren Build ausloesen.
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - uses: actions/checkout@v4

      - name: Java 21 einrichten
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Verfuegbare Spigot-Version ermitteln
        id: spigot
        run: |
          # Die in der pom.xml eingetragene Version verwenden, wenn sie im
          # Spigot-Repository existiert - sonst auf die neueste 1.21er Version
          # zurueckfallen, damit der Build nicht an einer noch nicht
          # veroeffentlichten Version scheitert.
          POM_VERSION=$(mvn -B -q help:evaluate -Dexpression=spigot.version -DforceStdout 2>/dev/null | tail -1 || echo "")
          META="https://hub.spigotmc.org/nexus/content/repositories/snapshots/org/spigotmc/spigot-api/maven-metadata.xml"
          curl -sSL "$META" -o metadata.xml || true
          if [ -n "$POM_VERSION" ] && grep -q "<version>${POM_VERSION}</version>" metadata.xml; then
            echo "version=$POM_VERSION" >> "$GITHUB_OUTPUT"
          else
            FALLBACK=$(grep -o '<version>1\.21[^<]*</version>' metadata.xml | tail -1 | sed 's/<[^>]*>//g')
            echo "Version $POM_VERSION nicht verfuegbar - verwende $FALLBACK"
            echo "version=$FALLBACK" >> "$GITHUB_OUTPUT"
          fi

      - name: Bauen
        run: mvn -B clean package -Dspigot.version=${{ steps.spigot.outputs.version }}

      - name: JAR pruefen
        run: |
          ls -lh target/*.jar
          # Muss die Plugin-Beschreibung und die Hauptklasse enthalten,
          # sonst laedt der Server das Plugin nicht.
          unzip -p target/KlassenSMP-*.jar plugin.yml | head -5
          unzip -l target/KlassenSMP-*.jar | grep -q "de/klassensmp/KlassenSMP.class"
          for f in config.yml messages.yml kits.yml crates.yml quests.yml achievements.yml events.yml; do
            unzip -l target/KlassenSMP-*.jar | grep -q "$f" || { echo "FEHLT: $f"; exit 1; }
          done
          echo "JAR ist vollstaendig."

      - name: JAR hochladen
        uses: actions/upload-artifact@v4
        with:
          name: KlassenSMP
          path: target/KlassenSMP-*.jar
          if-no-files-found: error

      - name: Fertige JAR ins Repository legen
        if: github.event_name == 'push'
        run: |
          # Die fertige Datei liegt danach unter dist/ und kann direkt auf
          # GitHub heruntergeladen werden - ohne Maven, ohne Anmeldung.
          mkdir -p dist
          cp target/KlassenSMP-*.jar dist/Klassen-SMP-Plugin.jar
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f dist/Klassen-SMP-Plugin.jar
          if git diff --cached --quiet; then
            echo "JAR unveraendert - kein Commit noetig."
          else
            git commit -m "Fertige Plugin-JAR aktualisiert [skip ci]"
            git push origin HEAD:${GITHUB_REF_NAME}
          fi
