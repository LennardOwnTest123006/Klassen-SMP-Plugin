# ============================================================================
#  KlassenSMP - Taegliche und woechentliche Aufgaben
#
#  Jeder Spieler bekommt pro Zeitraum zufaellig "daily-count" bzw.
#  "weekly-count" Aufgaben aus dem jeweiligen Pool. Die Auswahl ist an die
#  UUID des Spielers und den Zeitraum gebunden und bleibt deshalb ueber
#  Serverneustarts hinweg gleich - sie wechselt automatisch mit dem Tag
#  bzw. der Kalenderwoche.
#
#  type   : BREAK_BLOCKS, PLACE_BLOCKS, KILL_MOBS, KILL_PLAYERS, PLAY_MINUTES,
#           EARN_MONEY, FISH_ITEMS, CRAFT_ITEMS, MINE_ORE, WALK_BLOCKS
#  target : optionaler Filter (Material- oder Mob-Name), leer = beliebig
#  period : DAILY oder WEEKLY
# ============================================================================

